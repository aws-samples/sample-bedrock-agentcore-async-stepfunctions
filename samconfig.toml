version = 0.1

[default.global.parameters]
stack_name = "flow-credi-poc"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
# Informe o ARN do AgentCore Runtime apos rodar `agentcore deploy`:
# parameter_overrides = "AgentRuntimeArn=arn:aws:bedrock-agentcore:us-east-1:ACCOUNT:runtime/sup-agent-XXXX"
