AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Asynchronous document analysis pipeline.
  Step Functions (Standard) uses the waitForTaskToken pattern to wake up only
  when the Bedrock AgentCore agent finishes (~15s), without keeping a Lambda
  blocked. Full observability via X-Ray + structured logs.

Parameters:
  AgentRuntimeArn:
    Type: String
    Description: >
      ARN of the already-deployed Bedrock AgentCore Runtime (via `agentcore deploy`).
      E.g.: arn:aws:bedrock-agentcore:us-east-1:123456789012:runtime/docpipeline-XXXX
    Default: ""

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    # Observability: X-Ray enabled on all Lambdas
    Tracing: Active
    Environment:
      Variables:
        LOG_LEVEL: !Ref LogLevel
        SIMULATED_WORK_SECONDS: "2"

Resources:

  # =========================================================================
  # Pipeline Lambdas (sleep 2s + structured logs in the early steps)
  # =========================================================================

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: doc-pipeline-extract
      CodeUri: functions/extract/
      Handler: index.handler
      Description: Document OCR/extraction (simulates 2s of work)
      Policies:
        - Statement:
            - Sid: TextractRead
              Effect: Allow
              Action:
                - textract:DetectDocumentText
                - textract:AnalyzeDocument
              Resource: "*"

  IdentifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: doc-pipeline-identify
      CodeUri: functions/identify/
      Handler: index.handler
      Description: >
        Classifies the document and decides the routing flags (synchronous,
        simulates 2s). Does NOT call the agent — the heavy analysis is in Validate.

  ValidateDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: doc-pipeline-validate-dispatcher
      CodeUri: functions/validate_dispatcher/
      Handler: index.handler
      Description: >
        Receives the taskToken from Step Functions, invokes the AgentCore
        Runtime (asynchronously) to VALIDATE the document and RETURNS
        immediately (does not block).
      Timeout: 15
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
      Policies:
        - Statement:
            - Sid: InvokeAgentCore
              Effect: Allow
              Action:
                - bedrock-agentcore:InvokeAgentRuntime
              Resource: "*"
    Metadata:
      # Bundles @aws-sdk/client-bedrock-agentcore (not included in the runtime).
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node22
        Minify: false
        OutExtension:
          - .js=.mjs
        # Define require/__dirname in an ESM bundle (the SDK's CJS deps use require)
        Banner:
          - js=import { createRequire } from 'module';const require = createRequire(import.meta.url);
        EntryPoints:
          - index.mjs

  ValidateResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: doc-pipeline-validate-result
      CodeUri: functions/validate_result/
      Handler: index.handler
      Description: >
        Step AFTER the agent. Runs when Step Functions wakes up; processes the
        verdict returned by AgentCore (simulates 2s). Proves the post-agent logic.

  OrganizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: doc-pipeline-organize
      CodeUri: functions/organize/
      Handler: index.handler
      Description: Organizes the analyzed document (simulates 2s of work)

  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: doc-pipeline-validate
      CodeUri: functions/validate/
      Handler: index.handler
      Description: >
        "Light" validation used inside the Parallel (simulates 2s). Agent-based
        (asynchronous) validation happens in the ValidateSolo state.

  # =========================================================================
  # State Machine (Standard — required for waitForTaskToken)
  # =========================================================================

  DocumentPipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: doc-pipeline
      Type: STANDARD
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        ExtractFunctionArn: !GetAtt ExtractFunction.Arn
        IdentifyFunctionArn: !GetAtt IdentifyFunction.Arn
        ValidateDispatcherFunctionArn: !GetAtt ValidateDispatcherFunction.Arn
        ValidateResultFunctionArn: !GetAtt ValidateResultFunction.Arn
        OrganizeFunctionArn: !GetAtt OrganizeFunction.Arn
        ValidateFunctionArn: !GetAtt ValidateFunction.Arn
      Tracing:
        Enabled: true   # X-Ray on the state machine
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt PipelineLogGroup.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref IdentifyFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ValidateDispatcherFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ValidateResultFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref OrganizeFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ValidateFunction
        - Statement:
            - Sid: XRayTracing
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: "*"
        - Statement:
            - Sid: CloudWatchLogsForSfn
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/doc-pipeline
      RetentionInDays: 14

  # =========================================================================
  # State Machine 2 (DIRECT): calls AgentCore WITHOUT a Lambda dispatcher,
  # via SDK integration (invokeAgentRuntime, synchronous request-response).
  # Used to compare side by side with the waitForTaskToken + Lambda version.
  # =========================================================================

  DocumentPipelineDirect:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: doc-pipeline-direct
      Type: STANDARD
      DefinitionUri: statemachine/pipeline-direct.asl.json
      DefinitionSubstitutions:
        ExtractFunctionArn: !GetAtt ExtractFunction.Arn
        IdentifyFunctionArn: !GetAtt IdentifyFunction.Arn
        AgentRuntimeArn: !Ref AgentRuntimeArn
      Tracing:
        Enabled: true
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt PipelineDirectLogGroup.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref IdentifyFunction
        - Statement:
            - Sid: InvokeAgentCoreDirect
              Effect: Allow
              Action:
                - bedrock-agentcore:InvokeAgentRuntime
              Resource: "*"
        - Statement:
            - Sid: XRayTracing
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: "*"
        - Statement:
            - Sid: CloudWatchLogsForSfn
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"

  PipelineDirectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/doc-pipeline-direct
      RetentionInDays: 14

  # =========================================================================
  # Permission for AgentCore to wake up Step Functions (SendTaskSuccess/Failure)
  # Role assumed by the AgentCore runtime — ARN exported for use during deploy.
  # =========================================================================

  AgentCallbackPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: doc-pipeline-agent-callback
      Description: Allows the agent to wake up Step Functions via task token
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SendTaskCallback
            Effect: Allow
            Action:
              - states:SendTaskSuccess
              - states:SendTaskFailure
              - states:SendTaskHeartbeat
            Resource: !Ref DocumentPipeline

Outputs:
  StateMachineArn:
    Description: ARN of the pipeline state machine (with Lambda + waitForTaskToken)
    Value: !Ref DocumentPipeline

  StateMachineDirectArn:
    Description: ARN of the DIRECT state machine (AgentCore without Lambda, SDK integration)
    Value: !Ref DocumentPipelineDirect

  AgentCallbackPolicyArn:
    Description: >
      Attach this managed policy to the AgentCore Runtime execution role
      so it can call SendTaskSuccess/SendTaskFailure.
    Value: !Ref AgentCallbackPolicy

  ValidateDispatcherFunctionName:
    Value: !Ref ValidateDispatcherFunction
